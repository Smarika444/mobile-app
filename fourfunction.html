<!DOCTYPE html>
<html>
<body>

<input type="number" id="num1" placeholder="Enter first number">
<input type="number" id="num2" placeholder="Enter second number">

<br><br>

<button onclick="calculate()">Calculate</button>

<br><br>

<div id="add"></div>
<div id="subtract"></div>
<div id="multiply"></div>
<div id="divide"></div>

<script>
function calculate() {
    let a = document.getElementById("num1").value;
    let b = document.getElementById("num2").value;

    a = Number(a);
    b = Number(b);

    document.getElementById("add").innerHTML = "Addition: " + (a + b);
    document.getElementById("subtract").innerHTML = "Subtraction: " + (a - b);
    document.getElementById("multiply").innerHTML = "Multiplication: " + (a * b);
    document.getElementById("divide").innerHTML = "Division: " + (a / b);
}
</script>

</body>
</html>
