<!DOCTYPE html>
<html>
<head>
    <title>Light Bulb ON/OFF</title>
</head>
<body>

<h2>Light Bulb Example</h2>

<img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif" width="100">

<br><br>

<button onclick="toggleBulb()">ON / OFF</button>

<script>
function toggleBulb() {
    var bulb = document.getElementById("bulb");

    if (bulb.src.match("bulboff")) {
        bulb.src = "https://www.w3schools.com/js/pic_bulbon.gif";
    } else {
        bulb.src = "https://www.w3schools.com/js/pic_bulboff.gif";
    }
}
</script>

</body>
</html>
