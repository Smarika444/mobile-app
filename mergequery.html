<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .gallery {
            float: left;
            width: 25%;
            padding: 10px;
        }

        .gallery img {
            width: 100%;
            height: 200px;          
            object-fit: cover;     
        }

        @media screen and (max-width: 760px) {
            .gallery {
                width: 50%;
            }
        }

        @media screen and (max-width: 400px) {
            .gallery {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<h2>Responsive Image Gallery</h2>
<p>Resize the browser window to see the effect.</p>

<div class="gallery">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Grosser_Panda.JPG/500px-Grosser_Panda.JPG">
</div>
